---
name: "Update Calico charts and images"
# Make sure we can pull in github repos from multiple orgs
scms:
  rke2:
    kind: "github"
    spec:
      user: "{{ .github.user }}"
      email: "{{ .github.email }}"
      username: "{{ requiredEnv .github.username }}"
      token: '{{ requiredEnv .github.token }}'
      owner: "{{ .github.owner }}"
      repository: "{{ .github.repo }}"
      branch: '{{ .github.branch }}'

sources:
  calico:
    name: "Get Calico {{ .versions.calico | default "latest" }} chart version"
    kind: "helmchart"
    spec:
      url: https://rancher.github.io/rke2-charts
      name: rke2-calico
      versionfilter:
        kind: "regex"
{{- if .versions.calico }}
        pattern: '^v?{{ regexQuoteMeta .versions.calico }}\.\d+$'
{{- else }}
        pattern: '^v?\d+\.\d+\.\d+$'
{{- end }}
  issue:
    name: "Get issue number"
    kind: "shell"
    scmid: "rke2"
    spec:
      command: bash {{ requiredEnv "UPDATECLI_SCRIPTS_DIR" }}/create-issue.sh rke2-calico {{ source "calico" }}
      environments:
        - name: GH_TOKEN
          value: '{{ requiredEnv .github.token }}'
  
conditions:
  calicoVersionShouldBeUpdated:
    name: "Check if Calico chart should be updated or not"
    kind: shell
    scmid: "rke2"
    sourceid: calico
    spec:
      command: bash {{ requiredEnv "UPDATECLI_SCRIPTS_DIR" }}/validate_version.sh rke2-calico

targets:
  calicoCNI:
    name: "Update the Calico airgap images"
    kind: "shell"
    scmid: "rke2"
    sourceid: calico
    spec:
      command: bash {{ requiredEnv "UPDATECLI_SCRIPTS_DIR" }}/update_chart_and_images_cni.sh rke2-calico
      environments:
        - name: GH_TOKEN
          value: '{{ requiredEnv .github.token }}'
      changedif:
        kind: file/checksum
        spec:
          files:
            - charts/chart_versions.yaml

actions:
  github:
    kind: "github/pullrequest"
    scmid: "rke2"
    spec:
      merge:
        strategy: manual
      draft: false
      mergemethod: squash
      parent: false
      title: '[{{ .github.branch }}] Update Calico chart to {{ source "calico" }}'
      description: 'This is an automated PR to update Helm chart versions. issue #{{ source "issue" }}'
