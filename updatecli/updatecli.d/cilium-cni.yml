---
name: "Update Cilium charts and images"
# Make sure we can pull in github repos from multiple orgs
scms:
  rke2:
    kind: "github"
    spec:
      user: "{{ .github.user }}"
      email: "{{ .github.email }}"
      username: "{{ requiredEnv .github.username }}"
      token: '{{ requiredEnv .github.token }}'
      owner: "{{ .github.owner }}"
      repository: "{{ .github.repo }}"
      branch: '{{ .github.branch }}'

sources:
  cilium:
    name: "Get Cilium chart version"
    kind: "helmchart"
    spec:
      url: https://rancher.github.io/rke2-charts
      name: rke2-cilium
      versionfilter:
        kind: "latest"
  issue:
    name: "Get issue number"
    kind: "shell"
    scmid: "rke2"
    spec:
      command: bash {{ requiredEnv "UPDATECLI_SCRIPTS_DIR" }}/create-issue.sh rke2-cilium {{ source "cilium" }}
      environments:
        - name: GH_TOKEN
          value: '{{ requiredEnv .github.token }}'
  
conditions:
  ciliumVersionShouldBeUpdated:
    name: "Check if Cilium chart should be updated or not"
    kind: shell
    scmid: "rke2"
    sourceid: cilium
    spec:
      command: bash {{ requiredEnv "UPDATECLI_SCRIPTS_DIR" }}/validate_version.sh rke2-cilium

targets:
  ciliumCNI:
    name: "Update the Cilium airgap images"
    kind: "shell"
    scmid: "rke2"
    sourceid: cilium
    spec:
      command: bash {{ requiredEnv "UPDATECLI_SCRIPTS_DIR" }}/update_chart_and_images_cni.sh rke2-cilium
      changedif:
        kind: file/checksum
        spec:
          files:
            - charts/chart_versions.yaml

actions:
  github:
    kind: "github/pullrequest"
    scmid: "rke2"
    spec:
      merge:
        strategy: manual
      draft: false
      mergemethod: squash
      parent: false
      title: '[{{ .github.branch }}] Update Cilium chart to {{ source "cilium" }}'
      description: 'This is an automated PR to update Helm chart versions. issue #{{ source "issue" }}'
