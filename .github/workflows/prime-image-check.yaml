name: Prime Image Check
on:
  push:
    branches:
      - "master"
      - "release-*"
    paths:
      - "scripts/version.sh"
      - "scripts/check-prime-images"
      - ".github/workflows/prime-image-check.yaml"
  pull_request:
    paths:
      - "scripts/version.sh"
      - "scripts/check-prime-images"
      - ".github/workflows/prime-image-check.yaml"
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  check-prime-images:
    name: "Check Prime Images"
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    steps:
      # Fork PRs lack Vault secrets, so fail loudly (advisory) instead of silently skipping
      - name: Require same-repo branch for prime image changes
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository
        run: |
          echo "::error::Changes to prime image versions must be submitted from a branch in ${{ github.repository }}, not a fork, so the prime registry check can run."
          exit 1
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 1
      - name: Install crane
        uses: ./.github/actions/install-crane
      - name: Read secrets
        uses: rancher-eio/read-vault-secrets@dfae8acd43a9e170fca5f90168da22f814fe4e9a # main
        with:
          secrets: |
            secret/data/github/repo/${{ github.repository }}/rancher-prime-registry/credentials registry | PRIME_REGISTRY ;
            secret/data/github/repo/${{ github.repository }}/rancher-prime-registry/credentials username | PRIME_REGISTRY_USERNAME ;
            secret/data/github/repo/${{ github.repository }}/rancher-prime-registry/credentials password | PRIME_REGISTRY_PASSWORD ;
      - name: Check externally-published prime images exist
        env:
          REGISTRY: ${{ env.PRIME_REGISTRY }}
          PRIME_REGISTRY_USERNAME: ${{ env.PRIME_REGISTRY_USERNAME }}
          PRIME_REGISTRY_PASSWORD: ${{ env.PRIME_REGISTRY_PASSWORD }}
        run: ./scripts/check-prime-images
