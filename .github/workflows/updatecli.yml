name: "Updatecli: Dependency Management"

on:
  schedule:
    # Runs at 06 PM UTC
    - cron: '0 18 * * *'
  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:
    inputs:
      branch:
        description: "Branch to update (e.g. release-1.36). Leave empty to update all branches in updatecli/values.d."
        required: false
        type: string

permissions:
  contents: write
  id-token: write
  issues: write
  pull-requests: write

jobs:
  # The manifests and scripts on master drive every branch; each branch only
  # supplies its own updatecli/values.d/<branch>.yaml.
  branches:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/master'
    outputs:
      branches: ${{ steps.list.outputs.branches }}
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          sparse-checkout: updatecli/values.d

      - name: List branches
        id: list
        env:
          BRANCH: ${{ inputs.branch }}
        run: |
          if [ -n "${BRANCH}" ]; then
            if ! [[ "${BRANCH}" =~ ^(master|release-[0-9]+\.[0-9]+)$ ]] || [ ! -f "updatecli/values.d/${BRANCH}.yaml" ]; then
              echo "::error::no updatecli/values.d/${BRANCH}.yaml for branch '${BRANCH}'"
              exit 1
            fi
            branches=$(jq -cn --arg b "${BRANCH}" '[$b]')
          else
            branches=$(find updatecli/values.d -name '*.yaml' -exec basename {} .yaml \; | sort | jq -Rnc '[inputs]')
          fi
          echo "branches=${branches}" >> "${GITHUB_OUTPUT}"

  cleanup-branches:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/master'
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Delete leftover UpdateCLI branches
        run: |
          gh pr list \
            --search "is:closed is:pr head:updatecli_" \
            --json headRefName \
            --jq ".[].headRefName" | sort -u > closed_prs_branches.txt
          gh pr list \
            --search "is:open is:pr head:updatecli_" \
            --json headRefName \
            --jq ".[].headRefName" | sort -u > open_prs_branches.txt
          for branch in $(comm -23 closed_prs_branches.txt open_prs_branches.txt); do
            if (git ls-remote --exit-code --heads origin "$branch"); then
              echo "Deleting leftover UpdateCLI branch - $branch";
              git push origin --delete "$branch";
            fi
          done
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  updatecli:
    runs-on: ubuntu-latest
    needs: [branches, cleanup-branches]
    strategy:
      fail-fast: false
      matrix:
        branch: ${{ fromJSON(needs.branches.outputs.branches) }}
    name: updatecli (${{ matrix.branch }})
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Install Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: 'stable'
          cache: false

      - name: "Read Secrets"
        uses: rancher-eio/read-vault-secrets@4c8f4e741954651c502bb7739c46ae1bad26b44d # main
        with:
          secrets: |
            secret/data/github/repo/${{ github.repository }}/github/app-credentials appId | APP_ID ;
            secret/data/github/repo/${{ github.repository }}/github/app-credentials privateKey | PRIVATE_KEY

      - name: Generate App Token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        id: app-token
        with:
          client-id: ${{ env.APP_ID }}
          private-key: ${{ env.PRIVATE_KEY }}

      - name: Install Updatecli
        uses: updatecli/updatecli-action@93ae2608256484ef8598e902aa675bbc9e278e4e # v3.10.0

      - name: Apply Updatecli
        # Never use '--debug' option, because it might leak the access tokens.
        run: |
          updatecli pipeline apply --clean \
            --config ./updatecli/updatecli.d/ \
            --values ./updatecli/values.yaml \
            --values "./updatecli/values.d/${BRANCH}.yaml"
        env:
          BRANCH: ${{ matrix.branch }}
          UPDATECLI_SCRIPTS_DIR: ${{ github.workspace }}/updatecli/scripts
          UPDATECLI_GITHUB_ACTOR: ${{ github.actor }}
          UPDATECLI_GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}

